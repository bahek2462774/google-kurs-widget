<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Before you continue to Google Search</title>
</head>
<body>
  <!--
    Hand-crafted stub representing the shape of a real Google cookie-consent
    interstitial that an anonymous (no prior consent cookie) scraper request
    is likely to receive instead of the actual search results. There is no
    [data-exchange-rate] element anywhere on this page -- parseGoogleSerp
    must return null for this fixture.
  -->
  <div class="consent-bump">
    <h1>Before you continue to Google Search</h1>
    <p>We use cookies and data to deliver and maintain our services...</p>
    <button>Accept all</button>
    <button>Reject all</button>
  </div>
</body>
</html>
